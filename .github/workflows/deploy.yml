name: Deploy website

# Every push to main: check the JSON files, then upload changed files to the server.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check:
    name: Check content files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON
        run: |
          set -e
          for f in data/*.json; do
            python3 -m json.tool "$f" > /dev/null || { echo "::error file=$f::$f is not valid JSON – fix it before it goes live"; exit 1; }
          done
          echo "All JSON files are valid."

  deploy:
    name: Upload to server
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check FTP server name
        id: host
        env:
          RAW: ${{ secrets.FTP_SERVER }}
          # Hosting server's public IP – used when FTP_SERVER is empty or not in DNS.
          FALLBACK_IP: "103.180.236.111"
          SECURITY: ${{ vars.FTP_SECURITY || 'strict' }}
        run: |
          # Tidy common mistakes: "ftp://", trailing "/", a ":port", spaces or line breaks.
          host=$(printf '%s' "$RAW" | tr -d '[:space:]' | sed -E 's#^[a-zA-Z]+://##; s#/.*$##; s#:[0-9]+$##')
          if [ -n "$host" ] && ! printf '%s' "$host" | grep -Eq '^[0-9.]+$' && ! getent hosts "$host" > /dev/null; then
            echo "::warning::FTP_SERVER name is not in public DNS – using the server IP instead."
            host=""
          fi
          [ -z "$host" ] && host="$FALLBACK_IP"
          # A bare IP never matches the FTPS certificate, so relax the name check (still encrypted).
          if printf '%s' "$host" | grep -Eq '^[0-9.]+$'; then SECURITY=loose; fi
          echo "name=$host" >> "$GITHUB_OUTPUT"
          echo "security=$SECURITY" >> "$GITHUB_OUTPUT"

      - name: Upload over FTP / FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.host.outputs.name }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          port: ${{ vars.FTP_PORT || 21 }}
          server-dir: ${{ vars.FTP_DIR || './' }}
          security: ${{ steps.host.outputs.security }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            tools/**
            README.md
            HOW-TO-UPDATE.md
